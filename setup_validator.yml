---
- name: Setup Supra Validator node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [validator]
  vars_files:
    - group_vars/all.yml
    - group_vars/vault.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml
  tasks:
    - name: Run validator role
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include prepare role
          ansible.builtin.include_role:
            name: prepare
        - name: Include validator role
          ansible.builtin.include_role:
            name: validator
            public: true

  post_tasks:
    - name: Verify validator
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ validator_log_file_path }}"
            # supra's default prometheus_exporter_port, smr_settings.toml doesn't set it
            health_url: http://localhost:9000/metrics
